name: FoodWaste Ingestion Pipeline CI/CD

# 1. GATILHOS: Quando a esteira roda sozinha
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  # Agendador de tempo (Cron Job): Toda segunda-feira às 09:00 de Brasília (12:00 UTC)
  schedule:
    # Dispara às 18:50 UTC (15:50 no horário de Brasília)
    - cron: '50 18 * * *'
    
    # Dispara às 19:00 e 19:10 UTC (16:00 e 16:10 no horário de Brasília)
    - cron: '0,10 19 * * *'

jobs:
  # JOB 1: Validar a qualidade e sintaxe do código Python
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f src/ingestao/requirements.txt ]; then pip install -r src/ingestao/requirements.txt; fi

    - name: Lint com flake8 (Erros de sintaxe)
      run: |
        pip install flake8
        # Varre o projeto buscando erros críticos de sintaxe
        flake8 . --count --select=E9,F63,F7,F82 --show-source

  # JOB 2: Buildar o Docker e executar a carga direto no S3
  docker-build-and-run:
    needs: lint-and-test # Só roda se o Python passar no teste acima
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    # MÁGICA: Pega o bloco de texto do cofre (ENV_FILE) e recria o arquivo .env
    - name: Criar arquivo .env a partir do GitHub Secrets
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Constrói a sua imagem Docker a partir da raiz do projeto
    - name: Construir Imagem Docker do Pipeline
      run: |
        docker build -t foodwaste-api-ingestao -f src/ingestao/Dockerfile .

    # EXECUÇÃO DO SCRIPT: Liga o container passando o .env e força a execução direta do script Python
    - name: Executar Ingestão de Dados (Lançar Vendas no S3)
      run: |
        docker run --env-file .env foodwaste-api-ingestao python -m ingestao.ingestaoapi